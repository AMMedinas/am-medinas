plugins { id 'com.android.application' }

android {
    namespace 'mx.ammedinas.cabina'
    compileSdk 34
    defaultConfig {
        applicationId 'mx.ammedinas.cabina'
        minSdk 29
        targetSdk 34
        versionCode 6
        versionName '1.5'
    }

    // --- Firma real (opcional): se usa solo si existe el keystore y una contraseña.
    // Acepta la contraseña desde KEYSTORE_PASSWORD o KEY_PASSWORD (la misma llave usa
    // ambas), y el alias por defecto es 'cabina'. Si no hay contraseña, el build sigue
    // con la firma de depuración y NO se rompe (ni con secrets vacíos).
    def rutaKeystore = System.getenv('KEYSTORE_FILE')
    def passStore = (System.getenv('KEYSTORE_PASSWORD') ?: System.getenv('KEY_PASSWORD') ?: '').trim()
    def passKey   = (System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD') ?: '').trim()
    def aliasLlave = (System.getenv('KEY_ALIAS') ?: 'cabina').trim()
    def hayFirmaReal = rutaKeystore != null && !rutaKeystore.isEmpty() && file(rutaKeystore).exists() && !passStore.isEmpty()
    signingConfigs {
        release {
            if (hayFirmaReal) {
                storeFile file(rutaKeystore)
                storePassword passStore
                keyAlias aliasLlave
                keyPassword passKey
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true          // R8: ofusca y elimina código no usado (dificulta la ingeniería inversa)
            shrinkResources true         // elimina recursos no usados del APK
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Firma real si está configurada; si no, la de depuración (para no romper el build).
            signingConfig hayFirmaReal ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
