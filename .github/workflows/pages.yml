name: Publicar sitio (ofuscado)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar herramientas
        run: npm i --no-save javascript-obfuscator@4.1.1 playwright@1.47.2

      - name: Preparar las carpetas del sitio
        run: |
          rm -rf _src _site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='node_modules' \
            --exclude='_src' --exclude='_site' --exclude='android' \
            --exclude='package.json' --exclude='package-lock.json' --exclude='.gitignore' \
            ./ _src/
          cp -a _src/. _site/

      - name: Ofuscar el JavaScript en línea
        run: node .github/scripts/construir.js _site

      - name: Verificar en navegador (bloquea el despliegue si algo se rompe)
        run: |
          npx playwright install --with-deps chromium
          node .github/scripts/smoke.js _src _site

      - name: Activar y configurar Pages (despliegue por Actions)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir el sitio ofuscado
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
