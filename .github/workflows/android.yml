name: App Android de la cabina

on:
  push:
    branches: [main]
    paths: ['android/app/**', 'android/*.gradle', 'android/gradle.properties', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar la llave de firma (si está configurada)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/android/app/firma.jks"
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/android/app/firma.jks" >> "$GITHUB_ENV"
            echo "Firma real: lista."
          else
            echo "Sin secret KEYSTORE_B64: se usará la firma de depuración."
          fi
      - name: Diagnóstico de la firma (temporal)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          F="$GITHUB_WORKSPACE/android/app/firma.jks"
          [ -f "$F" ] || { echo "no hay firma.jks"; exit 0; }
          echo "SHA256 keystore decodificado: $(sha256sum "$F" | cut -d' ' -f1)"
          echo "SHA256 esperado (bueno):      789f0eeebde3eb6ecedc7f51dcc767518e2df823b234c5cdc10638d15a5205ca"
          echo "tamaño firma.jks: $(wc -c < "$F") bytes (esperado ~2632)"
          echo "largo KEYSTORE_PASSWORD: ${#KEYSTORE_PASSWORD}  | largo KEY_PASSWORD: ${#KEY_PASSWORD}  (esperado 20)"
          P="${KEYSTORE_PASSWORD:-$KEY_PASSWORD}"
          echo "--- keytool -list con esa contraseña ---"
          keytool -list -keystore "$F" -storepass "$P" 2>&1 | head -8 || true
      - name: Compilar la app
        id: build
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/compilacion.log
      - name: Guardar el resultado en el repositorio
        run: |
          git config user.name "AM Medinas"
          git config user.email "armandomedinar@itbridge.edu.mx"
          mkdir -p descargas
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk descargas/CabinaAMM360.apk
            echo "OK $(date -u +%Y-%m-%dT%H:%M:%SZ) ${GITHUB_SHA}" > android/estado.txt
            git add descargas/CabinaAMM360.apk android/estado.txt
          else
            { echo "ERROR $(date -u +%Y-%m-%dT%H:%M:%SZ) ${GITHUB_SHA}"; grep -n -E "error:|FAILURE|What went wrong|Could not|e: " /tmp/compilacion.log | head -80; echo '-----'; tail -c 30000 /tmp/compilacion.log; } > android/estado.txt
            git add android/estado.txt
          fi
          git commit -m "App Android: resultado de la compilación" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
