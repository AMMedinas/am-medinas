name: App Android de la cabina

on:
  push:
    branches: [main]
    paths: ['android/app/**', 'android/*.gradle', 'android/gradle.properties', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar la llave de firma
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          ENC="$GITHUB_WORKSPACE/android/app/firma.jks.enc"
          OUT="$GITHUB_WORKSPACE/android/app/firma.jks"
          P="${KEYSTORE_PASSWORD:-$KEY_PASSWORD}"
          if [ -f "$ENC" ] && [ -n "$P" ]; then
            # Keystore cifrado en el repo: se descifra con la contraseña (secret).
            if openssl enc -d -aes-256-cbc -pbkdf2 -in "$ENC" -out "$OUT" -pass pass:"$P" 2>/dev/null; then
              echo "KEYSTORE_FILE=$OUT" >> "$GITHUB_ENV"
              echo "Firma real: keystore descifrado ($(wc -c < "$OUT") bytes)."
            else
              echo "No se pudo descifrar el keystore (¿contraseña distinta?). Se usará la de depuración."
            fi
          elif [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$OUT"
            echo "KEYSTORE_FILE=$OUT" >> "$GITHUB_ENV"
            echo "Firma real: keystore desde KEYSTORE_B64."
          else
            echo "Sin keystore disponible: se usará la firma de depuración."
          fi
      - name: Compilar la app
        id: build
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/compilacion.log
      - name: Guardar el resultado en el repositorio
        run: |
          git config user.name "AM Medinas"
          git config user.email "armandomedinar@itbridge.edu.mx"
          mkdir -p descargas
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk descargas/CabinaAMM360.apk
            echo "OK $(date -u +%Y-%m-%dT%H:%M:%SZ) ${GITHUB_SHA}" > android/estado.txt
            git add descargas/CabinaAMM360.apk android/estado.txt
          else
            { echo "ERROR $(date -u +%Y-%m-%dT%H:%M:%SZ) ${GITHUB_SHA}"; grep -n -E "error:|FAILURE|What went wrong|Could not|e: " /tmp/compilacion.log | head -80; echo '-----'; tail -c 30000 /tmp/compilacion.log; } > android/estado.txt
            git add android/estado.txt
          fi
          git commit -m "App Android: resultado de la compilación" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
