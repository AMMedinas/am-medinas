<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gimnasio de Carisma</title>
<meta name="description" content="Practica voz, conversaciones difíciles, lenguaje corporal y liderazgo 10 minutos al día.">
<meta name="theme-color" content="#0b0f17">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23ff7a45'/><text x='50' y='68' font-size='56' text-anchor='middle' font-family='Arial' font-weight='bold' fill='white'>C</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f17;--panel:#121826;--panel2:#182033;--panel3:#1f2940;--line:#26324b;
  --text:#e9edf5;--muted:#95a2bb;--dim:#6b7892;
  --acc:#ff7a45;--acc-soft:rgba(255,122,69,.14);
  --vio:#8b6cff;--vio-soft:rgba(139,108,255,.15);
  --cyan:#36cfe3;--cyan-soft:rgba(54,207,227,.14);
  --ok:#2ecc8f;--ok-soft:rgba(46,204,143,.14);
  --warn:#ffc547;--warn-soft:rgba(255,197,71,.14);
  --bad:#ff5d6c;--bad-soft:rgba(255,93,108,.14);
  --r:16px;--r-sm:11px;
  --head:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --nav-h:68px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 var(--body);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 85% -10%,rgba(139,108,255,.13),transparent 60%),radial-gradient(700px 400px at -10% 10%,rgba(255,122,69,.10),transparent 60%)}
h1,h2,h3,h4{font-family:var(--head);margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:clamp(24px,5vw,34px);font-weight:800}
h2{font-size:clamp(20px,3.6vw,24px);font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
a{color:var(--cyan)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:13px}.tiny{font-size:12px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}

/* Layout */
.app{position:relative;z-index:1;display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:rgba(11,15,23,.7);backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--vio));display:grid;place-items:center;font:800 20px var(--head);color:#fff;flex:none;box-shadow:0 6px 20px rgba(255,122,69,.3)}
.brand b{font:700 16px/1.1 var(--head);display:block}
.brand span{font-size:12px;color:var(--muted)}
.nav-btn{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;border:0;background:none;color:var(--muted);font-weight:600;text-align:left;width:100%;transition:.15s}
.nav-btn svg{width:21px;height:21px;flex:none}
.nav-btn:hover{background:var(--panel);color:var(--text)}
.nav-btn.on{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--acc)}
.side .spacer{flex:1}
.main{padding:28px clamp(16px,4vw,44px) 60px;max-width:1120px;width:100%}
.topbar{display:none}
.bottom{display:none}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(11,15,23,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .topbar .logo{width:32px;height:32px;font-size:17px;border-radius:10px}
  .topbar b{font:700 16px var(--head)}
  .main{padding:18px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
  .bottom{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(14,19,30,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .bottom .nav-btn{flex-direction:column;gap:3px;padding:9px 2px 8px;font-size:10.5px;justify-content:center;align-items:center;text-align:center;border-radius:0;box-shadow:none}
  .bottom .nav-btn.on{background:none;color:var(--acc)}
  .bottom .nav-btn svg{width:22px;height:22px}
}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:20px;height:20px}
.icon-btn:hover{color:var(--text)}

/* Components */
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.head p{color:var(--muted);margin-top:6px;max-width:640px}
.kicker{font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.pad-lg{padding:22px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 16px;border-radius:12px;font-weight:600;transition:.15s;min-height:42px;text-decoration:none}
.btn:hover{background:var(--panel3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.vio{background:var(--vio);border-color:var(--vio);color:#fff}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:rgba(255,93,108,.4);background:none}
.btn.sm{padding:7px 12px;min-height:34px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.acc{background:var(--acc-soft);border-color:transparent;color:var(--acc)}
.chip.vio{background:var(--vio-soft);border-color:transparent;color:#b3a2ff}
.chip.cyan{background:var(--cyan-soft);border-color:transparent;color:var(--cyan)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--muted);padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px}
.seg button.on{background:var(--panel3);color:var(--text)}
label.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.inp,select.inp,textarea.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 13px;outline:none;transition:.15s}
.inp:focus{border-color:var(--vio);box-shadow:0 0 0 3px var(--vio-soft)}
textarea.inp{resize:vertical;min-height:70px}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.note.warn{background:var(--warn-soft);border-color:rgba(255,197,71,.3);color:#f1dfae}
.note.bad{background:var(--bad-soft);border-color:rgba(255,93,108,.3);color:#ffc3c9}
.note.ok{background:var(--ok-soft);border-color:rgba(46,204,143,.3);color:#b8f0d8}
.note svg{width:18px;height:18px;flex:none;margin-top:1px}
.divider{height:1px;background:var(--line);margin:16px 0}

/* Home */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#1b1630,#121826 55%);border:1px solid var(--line);border-radius:22px;padding:26px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,69,.35),transparent 70%)}
.hero > *{position:relative;z-index:1}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat .v{font:800 28px/1 var(--head);margin-top:8px}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:600}
.routine{display:grid;gap:10px}
.rt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;transition:.15s;text-align:left;width:100%;color:var(--text)}
.rt:hover{border-color:var(--dim)}
.rt .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--dim);display:grid;place-items:center;flex:none}
.rt.done .ck{background:var(--ok);border-color:var(--ok)}
.rt.done .ck svg{display:block}
.rt .ck svg{display:none;width:15px;height:15px;color:#fff}
.rt .t{font-weight:600}
.rt .m{font-size:12.5px;color:var(--muted)}
.rt .min{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.weeks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.weeks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wk{padding:14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}
.wk.now{border-color:var(--acc);background:linear-gradient(180deg,var(--acc-soft),var(--panel2))}
.wk h4{font-size:15px;margin:6px 0 8px}
.wk ul{margin:0;padding-left:16px;font-size:13px;color:var(--muted)}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.lesson{position:relative;text-align:left;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--text);transition:.15s;min-height:104px;display:flex;flex-direction:column;gap:8px}
.lesson:hover{border-color:var(--vio);transform:translateY(-2px)}
.lesson .n{font:800 13px var(--head);color:var(--vio)}
.lesson .tt{font-weight:600;font-size:14.5px;line-height:1.35}
.lesson .ft{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.lesson.master{border-color:rgba(46,204,143,.5)}
.lesson.master .n{color:var(--ok)}
details.guide{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:0 18px}
details.guide summary{cursor:pointer;list-style:none;padding:16px 0;font:700 16px var(--head);display:flex;justify-content:space-between;align-items:center}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary::after{content:"+";font-size:22px;color:var(--muted)}
details.guide[open] summary::after{content:"−"}
details.guide .gbody{padding-bottom:18px;color:var(--muted);font-size:14px}
details.guide ol{padding-left:20px;margin:8px 0}
details.guide li{margin-bottom:8px}
details.guide li b{color:var(--text)}

/* Voice */
.rec-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
.rec-btn{width:96px;height:96px;border-radius:50%;border:0;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 10px 34px rgba(255,122,69,.35);transition:.2s;position:relative}
.rec-btn svg{width:38px;height:38px}
.rec-btn.on{background:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,93,108,.5)}70%{box-shadow:0 0 0 22px rgba(255,93,108,0)}100%{box-shadow:0 0 0 0 rgba(255,93,108,0)}}
.timer{font:800 34px/1 var(--head);font-variant-numeric:tabular-nums}
.meter{width:100%;max-width:340px;height:8px;border-radius:99px;background:var(--panel3);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--warn),var(--acc));transition:width .08s}
.live{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%}
@media (max-width:520px){.live{grid-template-columns:repeat(2,minmax(0,1fr))}}
.live .stat{text-align:center;padding:12px}
.live .stat .v{font-size:24px}
.transcript{min-height:110px;max-height:240px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:15px;line-height:1.7}
.transcript mark{background:var(--bad-soft);color:#ffb3bb;border-radius:5px;padding:0 3px}
.transcript .interim{color:var(--dim)}
.prompter{height:260px;overflow:hidden;position:relative;background:var(--bg);border:1px solid var(--line);border-radius:14px;scroll-behavior:auto}
.prompter::before,.prompter::after{content:"";position:absolute;left:0;right:0;height:46px;z-index:2;pointer-events:none}
.prompter::before{top:0;background:linear-gradient(var(--bg),transparent)}
.prompter::after{bottom:0;background:linear-gradient(transparent,var(--bg))}
.prompter .inner{padding:100px 22px 160px;font:600 clamp(20px,3.4vw,27px)/1.7 var(--head)}
.pz{display:inline-flex;align-items:center;justify-content:center;margin:0 6px;padding:0 9px;height:26px;border-radius:8px;background:var(--vio-soft);color:#b3a2ff;font:700 13px var(--body);vertical-align:middle}
.pz.l{background:var(--acc-soft);color:var(--acc)}
.prompter .guide-line{position:absolute;left:0;right:0;top:96px;height:2px;background:rgba(255,122,69,.35);z-index:1}
.score-ring{--v:0;--c:var(--ok);width:126px;height:126px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v)*1%),var(--panel3) 0);display:grid;place-items:center;flex:none}
.score-ring > div{width:100px;height:100px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center}
.score-ring b{font:800 32px/1 var(--head)}
.score-ring span{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.metric{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.metric:last-child{border-bottom:0}
.metric .k{color:var(--muted);font-size:14px}
.metric .vv{font-weight:700;text-align:right}
.tips{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.tips li{margin-bottom:6px}
.hist{display:grid;gap:8px}
.hist .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);border-radius:11px;font-size:13.5px;flex-wrap:wrap}

/* Simulator */
.scen{text-align:left;padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--text);display:flex;flex-direction:column;gap:8px;transition:.15s}
.scen:hover{border-color:var(--acc);transform:translateY(-2px)}
.scen .em{font-size:26px;line-height:1}
.scen p{font-size:13.5px;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:min(56vh,520px);min-height:220px;overflow:auto;padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:14px}
.msg{max-width:84%;padding:11px 14px;border-radius:15px;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word}
.msg.them{background:var(--panel2);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px}
.msg.me{background:var(--vio);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.msg .who{display:block;font-size:11.5px;font-weight:700;opacity:.75;margin-bottom:3px}
.msg.sys{align-self:center;background:none;color:var(--muted);font-size:12.5px;text-align:center;padding:4px}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin:0 2px;animation:bl 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.composer textarea{min-height:48px;max-height:140px}
.composer .icon-btn{width:48px;height:48px;flex:none}
.composer .icon-btn.on{background:var(--bad);border-color:var(--bad);color:#fff}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{text-align:left;padding:13px 15px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:14.5px;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--vio)}
.opt.best{border-color:var(--ok);background:var(--ok-soft)}
.opt.pick{border-color:var(--vio);box-shadow:0 0 0 2px var(--vio-soft)}
.opt:disabled{cursor:default}
.bars3{display:grid;gap:12px}
.bar3 .lb{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:5px}
.bar3 .tr{height:10px;border-radius:99px;background:var(--panel3);overflow:hidden}
.bar3 .tr i{display:block;height:100%;border-radius:99px}

/* Retos */
.reto-card{background:linear-gradient(135deg,#231a2e,#141b2b);border:1px solid var(--line);border-radius:22px;padding:26px;position:relative;overflow:hidden}
.reto-card .big{font:700 clamp(20px,3.5vw,26px)/1.35 var(--head);margin:12px 0 18px}
.streak{display:flex;align-items:center;gap:14px}
.streak .fire{width:54px;height:54px;border-radius:16px;background:var(--acc-soft);display:grid;place-items:center;font-size:28px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .d{aspect-ratio:1;border-radius:9px;background:var(--panel2);display:grid;place-items:center;font-size:12px;color:var(--dim);font-weight:600}
.cal .d.done{background:var(--ok);color:#06281b}
.cal .d.act{background:var(--vio-soft);color:#c8bcff}
.cal .d.today{outline:2px solid var(--acc);outline-offset:1px}
.cal .h{font-size:11px;color:var(--dim);text-align:center;font-weight:700}

/* Mirror */
.cam{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:4/3;border:1px solid var(--line)}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam video.mirror{transform:scaleX(-1)}
.cam .ov{position:absolute;inset:0;display:grid;place-items:center;font:800 80px var(--head);color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.6);pointer-events:none}
.cam .badge{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.6);padding:5px 11px;border-radius:99px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px}
.cam .badge i{width:9px;height:9px;border-radius:50%;background:var(--bad);animation:bl 1s infinite}
.cam .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted)}
.prog{height:6px;border-radius:99px;background:var(--panel3);overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);width:0}
.chk{display:grid;gap:10px}
.chk .ci{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);border-radius:12px;flex-wrap:wrap}
.chk .ci span{font-weight:600;font-size:14px}
.tri{display:inline-flex;gap:4px}
.tri button{border:1px solid var(--line);background:var(--bg);color:var(--muted);padding:6px 10px;border-radius:9px;font-size:12.5px;font-weight:600}
.tri button.on[data-v="2"]{background:var(--ok);border-color:var(--ok);color:#06281b}
.tri button.on[data-v="1"]{background:var(--warn);border-color:var(--warn);color:#2e2300}
.tri button.on[data-v="0"]{background:var(--bad);border-color:var(--bad);color:#fff}
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.flip{perspective:900px;height:150px;border:0;background:none;padding:0;color:var(--text)}
.flip .fi{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:14px;display:flex;flex-direction:column;justify-content:center;gap:6px;border:1px solid var(--line);text-align:left}
.flip .fa{background:var(--panel)}
.flip .fa b{font:700 16px var(--head)}
.flip .fb{background:var(--panel3);transform:rotateY(180deg);font-size:13px;color:var(--muted);overflow:auto}
.flip .fb b{color:var(--text)}

/* Progress */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--dim);font:11px var(--body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.empty-state{text-align:center;padding:28px 14px;color:var(--muted);font-size:14px}

/* Modal + toast */
.modal{position:fixed;inset:0;z-index:100;background:rgba(3,6,12,.7);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;animation:fade .2s}
.modal .box{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:200;background:var(--panel3);border:1px solid var(--line);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center;animation:fade .2s}
@media (min-width:861px){.toast{bottom:24px}}
.toast.ok{border-color:rgba(46,204,143,.5)}
.toast.bad{border-color:rgba(255,93,108,.5)}
.keyrow{display:flex;gap:8px}
.keyrow .inp{flex:1;min-width:0}

/* ============ ALMACENAMIENTO ============ */
const KEY = 'gimnasioCarisma.v1', KEY_API = 'gimnasioCarisma.apiKey';
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function defaults(){return {v:1,inicio:hoy(),nombre:'',voz:[],sim:[],espejo:[],retos:{},lecciones:{},modelo:'claude-sonnet-5-5',leer:true}}
function cargar(){
  const d = defaults();
  try{const raw=lsGet(KEY); if(raw){const o=JSON.parse(raw); if(o&&typeof o==='object') return sanear(Object.assign(d,o));}}catch(e){}
  return d;
}
function sanear(o){
  ['voz','sim','espejo'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});
  ['retos','lecciones'].forEach(k=>{if(!o[k]||typeof o[k]!=='object'||Array.isArray(o[k]))o[k]={}});
  if(typeof o.inicio!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(o.inicio))o.inicio=hoy();
  if(typeof o.nombre!=='string')o.nombre='';
  if(o.modelo!=='claude-sonnet-5-5'&&o.modelo!=='claude-haiku-5-5')o.modelo='claude-sonnet-5-5';
  o.leer = o.leer!==false;
  return o;
}
let S = cargar();
let storageOk = true;
function guardar(){ storageOk = lsSet(KEY, JSON.stringify(S)); actualizarRacha(); }
function apiKey(){return (lsGet(KEY_API)||'').trim()}

/* ============ UTILIDADES ============ */
function pad(n){return String(n).padStart(2,'0')}
function fechaStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function hoy(){return fechaStr(new Date())}
function diaDe(iso){return fechaStr(new Date(iso))}
function parseDia(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function difDias(a,b){return Math.round((parseDia(b)-parseDia(a))/864e5)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.from((r||document).querySelectorAll(s))}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function mmss(sec){sec=Math.max(0,Math.floor(sec));return pad(Math.floor(sec/60))+':'+pad(sec%60)}
function fechaCorta(iso){const d=new Date(iso);return d.toLocaleDateString('es-MX',{day:'numeric',month:'short'})+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function color(score){return score>=80?'var(--ok)':score>=60?'var(--warn)':'var(--bad)'}
function quitarAcentos(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'')}
let toastT;
function toast(msg,tipo){
  const old=$('.toast'); if(old) old.remove(); clearTimeout(toastT);
  const t=document.createElement('div'); t.className='toast '+(tipo||''); t.setAttribute('role','status'); t.textContent=msg;
  document.body.appendChild(t); toastT=setTimeout(()=>t.remove(),3200);
}
function modal(html){
  cerrarModal();
  const m=document.createElement('div'); m.className='modal'; m.innerHTML='<div class="box" role="dialog" aria-modal="true">'+html+'</div>';
  m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-close]'))cerrarModal()});
  document.body.appendChild(m); return m;
}
function cerrarModal(){const m=$('.modal'); if(m) m.remove();}
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrarModal()});

/* ============ ACTIVIDAD Y RACHA ============ */
function diasActivos(){
  const s=new Set();
  S.voz.forEach(x=>x&&x.f&&s.add(diaDe(x.f)));
  S.sim.forEach(x=>x&&x.f&&s.add(diaDe(x.f)));
  S.espejo.forEach(x=>x&&x.f&&s.add(diaDe(x.f)));
  Object.keys(S.retos).forEach(k=>{if(S.retos[k]&&S.retos[k].hecho)s.add(k)});
  return s;
}
function racha(set){
  set=set||diasActivos(); let d=new Date(); let n=0;
  if(!set.has(fechaStr(d))) d.setDate(d.getDate()-1);
  while(set.has(fechaStr(d))){n++; d.setDate(d.getDate()-1);}
  return n;
}
function rachaRetos(){
  const s=new Set(Object.keys(S.retos).filter(k=>S.retos[k]&&S.retos[k].hecho));
  return racha(s);
}
function actualizarRacha(){
  const r=racha();
  const a=$('#sideStreak'), b=$('#topStreak');
  if(a) a.textContent=r; if(b) b.textContent='🔥 '+r;
}
function hechoHoy(tipo){
  const h=hoy();
  if(tipo==='retos') return !!(S.retos[h]&&S.retos[h].hecho);
  return S[tipo].some(x=>x&&x.f&&diaDe(x.f)===h);
}
function semanaActual(){
  const d=Math.max(0,difDias(S.inicio,hoy()));
  return {n:(Math.floor(d/7)%4)+1, ciclo:Math.floor(d/28)+1};
}

/* ============ GRÁFICAS SVG ============ */
function lineChart(series,labels,opts){
  opts=opts||{}; const W=340,H=170,p={l:34,r:10,t:12,b:26};
  const all=series.flatMap(s=>s.v.filter(v=>v!=null));
  if(!all.length) return '<div class="empty-state">Aún no hay datos.</div>';
  let mn=opts.min!=null?opts.min:Math.min(...all), mx=opts.max!=null?opts.max:Math.max(...all);
  if(opts.band){mn=Math.min(mn,opts.band[0]);mx=Math.max(mx,opts.band[1]);}
  if(mx===mn){mx+=1;mn=Math.max(0,mn-1);}
  const rng=mx-mn; if(opts.min==null) mn=Math.max(opts.floor!=null?opts.floor:-Infinity,mn-rng*.08); if(opts.max==null) mx=mx+rng*.08;
  const n=labels.length, X=i=>p.l+(n<=1?(W-p.l-p.r)/2:i*(W-p.l-p.r)/(n-1)), Y=v=>p.t+(1-(v-mn)/(mx-mn))*(H-p.t-p.b);
  let g='';
  for(let k=0;k<=3;k++){const v=mn+(mx-mn)*k/3, y=Y(v); g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${p.l-6}" y="${y+4}" text-anchor="end">${Math.round(v)}</text>`;}
  if(opts.band){const y1=Y(opts.band[1]),y2=Y(opts.band[0]); g+=`<rect x="${p.l}" y="${y1}" width="${W-p.l-p.r}" height="${Math.max(0,y2-y1)}" fill="var(--ok)" opacity=".09"/>`;}
  const step=Math.max(1,Math.ceil(n/6));
  labels.forEach((lb,i)=>{if(i%step===0||i===n-1) g+=`<text x="${X(i)}" y="${H-7}" text-anchor="middle">${esc(lb)}</text>`});
  series.forEach(s=>{
    const pts=s.v.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
    if(pts.length>1) g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(q=>q.join(',')).join(' ')}"/>`;
    pts.forEach(q=>g+=`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="${s.c}" stroke="var(--panel)" stroke-width="1.5"/>`);
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function barChart(vals,labels,c){
  const W=340,H=170,p={l:26,r:8,t:12,b:26}; const mx=Math.max(1,...vals);
  const n=vals.length, bw=(W-p.l-p.r)/n;
  let g='';
  for(let k=0;k<=2;k++){const v=mx*k/2, y=p.t+(1-v/mx)*(H-p.t-p.b); g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${p.l-6}" y="${y+4}" text-anchor="end">${Math.round(v)}</text>`;}
  vals.forEach((v,i)=>{const h=(v/mx)*(H-p.t-p.b), x=p.l+i*bw+bw*.18, w=bw*.64, y=H-p.b-h;
    g+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(0,h)}" rx="4" fill="${c}"/>`;
    g+=`<text x="${x+w/2}" y="${H-7}" text-anchor="middle">${esc(labels[i])}</text>`;});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

/* ============ LABORATORIO DE VOZ ============ */
const MUL1 = new Set(['eh','ehh','ehhh','em','emm','mmm','mm','hmm','este','pues','bueno','tipo','osea','basicamente','literal','literalmente']);
const SIG_ESTE = new Set(['que','pues','el','la','los','las','eh','este','o','y','bueno','entonces','no','pero','como','mmm','em','ya','si','yo','nosotros','a','en','de','por','para']);
function analizarMuletillas(texto){
  const tk=quitarAcentos(texto.toLowerCase()).replace(/[^a-zñ0-9\s]/g,' ').split(/\s+/).filter(Boolean);
  const cnt={}; const marcas=new Array(tk.length).fill(false);
  for(let i=0;i<tk.length;i++){
    const w=tk[i];
    if(w==='o'&&tk[i+1]==='sea'){cnt['o sea']=(cnt['o sea']||0)+1;marcas[i]=marcas[i+1]=true;i++;continue;}
    if(!MUL1.has(w)) continue;
    if(w==='este'){const nx=tk[i+1]; if(nx!==undefined&&!SIG_ESTE.has(nx)) continue;}
    const k=w==='osea'?'o sea':w.replace(/^(eh+|em+|m+|hmm)$/,'eh / mmm');
    cnt[k]=(cnt[k]||0)+1; marcas[i]=true;
  }
  const total=Object.values(cnt).reduce((a,b)=>a+b,0);
  return {tk,cnt,total,marcas};
}
function resaltar(texto){
  // Resalta muletillas en el texto original (aproximado, palabra por palabra)
  const palabras=texto.split(/(\s+)/);
  const solo=palabras.filter(p=>p.trim());
  const an=analizarMuletillas(solo.join(' '));
  let j=0; let out='';
  for(const p of palabras){
    if(!p.trim()){out+=p;continue;}
    const limpio=quitarAcentos(p.toLowerCase()).replace(/[^a-zñ0-9]/g,'');
    // mapear índice en tokens (pueden diferir si hay signos sueltos)
    if(!limpio){out+=esc(p);continue;}
    const n=quitarAcentos(p.toLowerCase()).replace(/[^a-zñ0-9\s]/g,' ').split(/\s+/).filter(Boolean).length;
    let m=false; for(let q=j;q<j+n;q++) if(an.marcas[q]) m=true;
    out+= m? `<mark>${esc(p)}</mark>` : esc(p);
    j+=n;
  }
  return out;
}
function calificarVoz(r){
  let s=100; const tips=[];
  const min=r.dur/60;
  if(r.palabras>0){
    if(r.ppm<110){s-=Math.min(20,(110-r.ppm)*.6);tips.push('Tu ritmo fue lento. Apunta a 130–160 palabras por minuto: piensa la idea completa antes de decirla.');}
    else if(r.ppm>170){s-=Math.min(25,(r.ppm-170)*.6);tips.push('Hablaste rápido. Baja la velocidad y apóyate en pausas para que tu mensaje pese más.');}
    else tips.push('Excelente ritmo: estás en el rango que transmite seguridad.');
    const mpm=r.mul/Math.max(min,.25);
    s-=Math.min(35,mpm*7);
    if(r.mul===0) tips.push('Cero muletillas detectadas. ¡Muy bien!');
    else tips.push(`Usaste ${r.mul} muletilla${r.mul>1?'s':''}. Cuando sientas que viene un «este», cállate un segundo: el silencio suena más seguro.`);
  } else if(SR){ tips.push('No se detectaron palabras. Revisa que el micrófono correcto esté activo y habla un poco más cerca.'); s-=30; }
  const ppmin=r.pausas/Math.max(min,.25);
  if(r.dur>=20){
    if(ppmin<1.5){s-=10;tips.push('Hiciste pocas pausas. Agrega una pausa de un segundo antes y después de cada dato importante.');}
    else if(ppmin>12){s-=8;tips.push('Hubo muchos cortes. Prepara tus ideas en bloques para que el discurso fluya.');}
    else tips.push('Buen uso de pausas: le das tiempo al oyente para procesar.');
  }
  if(r.largas>0){s-=Math.min(12,r.largas*4);tips.push(`Tuviste ${r.largas} silencio${r.largas>1?'s':''} de más de 3 segundos. Ten a la mano tus tres puntos clave para no perder el hilo.`);}
  if(r.dur<20) tips.push('Para una medición confiable, habla al menos 30 segundos.');
  return {score:Math.round(clamp(s,0,100)),tips};
}

  $('#vozModo',el).onclick=e=>{const b=e.target.closest('button'); if(!b||grabando) return; modo=b.dataset.m; $$('#vozModo button',el).forEach(x=>x.classList.toggle('on',x===b)); pintarCfg();};
  pintarCfg();

  // ---- grabación ----
  let grabando=false, stream=null, ctx=null, an=null, rec=null, t0=0, raf=0, tick=0;
  let finalTxt='', interim='', pausas=[], hablando=false, ultimaVoz=0, vozIniciada=false, silIni=0, ruido=0.01, errorSR='';
  function pintarHist(){
    const h=$('#vozHist',el); const xs=S.voz.slice(-5).reverse();

  }

  async function iniciar(){
    if(!contextoSeguro||!tieneMedia){toast('Abre la app en Chrome para usar el micrófono','bad');return;}
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }

      avisos.innerHTML=`<div class="note bad" style="margin-bottom:14px">${I.info}<span>${e&&e.name==='NotAllowedError'?'Bloqueaste el permiso del micrófono. Toca el candado junto a la dirección, permite el micrófono y recarga la página.':e&&e.name==='NotFoundError'?'No se encontró ningún micrófono conectado.':'No se pudo abrir el micrófono. Cierra otras apps que lo estén usando e intenta de nuevo.'}</span></div>`;
      return;

    $$('#vozModo button',el).forEach(b=>b.disabled=true);

    try{
      const AC=window.AudioContext||window.webkitAudioContext; ctx=new AC();
      if(ctx.state==='suspended') await ctx.resume();
      const src=ctx.createMediaStreamSource(stream); an=ctx.createAnalyser(); an.fftSize=1024; src.connect(an);
    }catch(e){an=null;}
    if(SR){
      try{
        rec=new SR(); rec.lang='es-MX'; rec.continuous=true; rec.interimResults=true;
        rec.onresult=ev=>{
          interim='';
          for(let i=ev.resultIndex;i<ev.results.length;i++){
            const r=ev.results[i]; if(r.isFinal) finalTxt+=(finalTxt?' ':'')+r[0].transcript.trim(); else interim+=r[0].transcript;
          }
          pintarTr();
        };
        rec.onerror=ev=>{ if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){errorSR='permiso';} else if(ev.error==='network'){errorSR='red';} };
        rec.onend=()=>{ if(grabando&&!errorSR){ try{rec.start()}catch(e){} } };
        rec.start();
      }catch(e){rec=null;}
    }
    t0=performance.now();
    const pr=$('#prompter',el); let prPos=0; if(pr) pr.scrollTop=0;
    let last=t0;
    const buf=new Float32Array(1024);
    const loop=(now)=>{
      if(!grabando) return;
      const dt=(now-last)/1000; last=now;
      const el_s=(now-t0)/1000;
      if(an){
        an.getFloatTimeDomainData(buf); let sum=0; for(let i=0;i<buf.length;i++) sum+=buf[i]*buf[i];
        const rms=Math.sqrt(sum/buf.length);
        if(el_s<0.6) ruido=Math.max(ruido*.9+rms*.1,0.004); else if(!hablando) ruido=ruido*.995+Math.min(rms,ruido*1.5)*.005;
        const umbral=Math.max(0.012,ruido*2.6);
        const meter=$('#recMeter',el); if(meter) meter.style.width=clamp(rms*900,0,100)+'%';

      }
      if(pr){ prPos=Math.min(prPos+vel*dt, pr.scrollHeight); pr.scrollTop=prPos; }
      raf=requestAnimationFrame(loop);
    };
    raf=requestAnimationFrame(loop);
    tick=setInterval(()=>{const s=(performance.now()-t0)/1000; $('#recTimer',el).textContent=mmss(s); vivos(s); if(s>=600) detener();},250);
  }
  function pintarTr(){
    const tr=$('#tr',el); if(!tr) return;

  function vivos(s){

    if(errorSR==='permiso') avisos.innerHTML=`<div class="note warn" style="margin-bottom:14px">${I.info}<span>La transcripción no tiene permiso. Se miden tiempo y pausas; para palabras y muletillas permite el micrófono en Chrome.</span></div>`;
    if(errorSR==='red') avisos.innerHTML=`<div class="note warn" style="margin-bottom:14px">${I.info}<span>La transcripción de Chrome necesita internet. Revisa tu conexión.</span></div>`;
  }
  function apagar(){
    grabando=false; cancelAnimationFrame(raf); clearInterval(tick);
    if(rec){try{rec.onend=null;rec.stop()}catch(e){} }
    if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;}
    if(ctx){try{ctx.close()}catch(e){} ctx=null;}
  }
  function detener(){
    if(!grabando) return;
    const dur=(performance.now()-t0)/1000;
    // silencio final no cuenta como pausa
    apagar();
    $('#recBtn',el).classList.remove('on'); $('#recBtn',el).innerHTML=I.voz; $('#recBtn',el).disabled=true;
    $('#recHint',el).textContent='Analizando…'; $('#recMeter',el).style.width='0';
    setTimeout(()=>{
      const b=$('#recBtn',el); if(!b) return;
      b.disabled=false; $('#recHint',el).textContent='Toca el botón para empezar';
      $$('#vozModo button',el).forEach(x=>x.disabled=false);
      const sel=$('#txtSel',el); if(sel) sel.disabled=false;
      if(interim){finalTxt+=(finalTxt?' ':'')+interim.trim(); interim='';}

      if(dur<10){ $('#vozRes',el).innerHTML='<h3>Resultado</h3><div class="empty-state">La grabación fue muy corta. Habla al menos 10 segundos.</div>'; return; }
      const a=analizarMuletillas(finalTxt);

      const c=calificarVoz(r); r.score=c.score;

async function llamarIA(system,messages,maxTokens){
  const key=apiKey(); if(!key) throw new Error('SIN_KEY');
  let res;
  try{
    res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{
      'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:S.modelo,max_tokens:maxTokens||400,system,messages})});
  }catch(e){ throw new Error('RED'); }
  let data=null; try{data=await res.json()}catch(e){}
  if(!res.ok){
    const tipo=data&&data.error&&data.error.type;
    if(res.status===401) throw new Error('KEY');
    if(res.status===429) throw new Error('LIMITE');
    if(res.status===400&&/credit|balance/i.test(JSON.stringify(data||''))) throw new Error('SALDO');
    if(res.status===404||tipo==='not_found_error') throw new Error('MODELO');
    if(res.status===529||res.status>=500) throw new Error('SATURADO');
    throw new Error('OTRO:'+(data&&data.error&&data.error.message||res.status));
  }
  const txt=(data&&data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
  if(!txt) throw new Error('VACIO');
  return txt;
}
function msgError(e){
  const m=e&&e.message||'';
  if(m==='SIN_KEY') return 'Falta tu API key. Agrégala en Ajustes o usa el modo Guiado.';
  if(m==='KEY') return 'La API key no es válida. Revísala en Ajustes.';
  if(m==='LIMITE') return 'Se alcanzó el límite de uso por minuto. Espera un momento e intenta de nuevo.';
  if(m==='SALDO') return 'Tu cuenta de Anthropic no tiene saldo. Recárgala en console.anthropic.com.';
  if(m==='MODELO') return 'El modelo seleccionado no está disponible para tu cuenta. Cambia el modelo en Ajustes.';
  if(m==='SATURADO') return 'El servicio está saturado. Intenta de nuevo en unos segundos.';
  if(m==='RED') return 'Sin conexión con el servicio de IA. Revisa tu internet.';
  if(m==='VACIO') return 'La IA no respondió. Intenta de nuevo.';
  return 'Ocurrió un error: '+m.replace(/^OTRO:/,'');
}
function hablar(texto){
  if(!S.leer||!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(texto.replace(/[«»*]/g,'')); u.lang='es-MX'; u.rate=1.02;
    const vs=speechSynthesis.getVoices(); const v=vs.find(x=>/es[-_]MX/i.test(x.lang))||vs.find(x=>/^es/i.test(x.lang)); if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ============ ESPEJO ============ */
function vEspejo(el){
  let stream=null, recorder=null, chunks=[], url=null, tmr=0, cd=0, tema=TEMAS_ESPEJO[0], evals=new Array(CHECK_ESPEJO.length).fill(null), grabado=false;
  el.innerHTML=`
  <div class="head"><div><div class="kicker">Lecciones 1, 6 y 7</div><h1>Espejo de lenguaje corporal</h1>
  <p>Grábate 60 segundos, mira el video y evalúate con honestidad. El video se queda solo en tu dispositivo y se borra al salir.</p></div></div>
  <div class="seg" id="esTab"><button data-t="grabar" class="on">Grabarme</button><button data-t="fichas">Leer señales</button></div>
  <div id="esBody" class="mt16"></div>`;
  const body=$('#esBody',el);
  $('#esTab',el).onclick=e=>{const b=e.target.closest('button'); if(!b) return; $$('#esTab button',el).forEach(x=>x.classList.toggle('on',x===b)); b.dataset.t==='grabar'?grabar():fichas();};
  function hist(){
    return S.espejo.length? S.espejo.slice(-5).reverse().map(x=>`<div class="it"><span>${fechaCorta(x.f)}</span><b style="color:${color(x.score)}">${x.score}</b></div>`).join('') : '<div class="empty-state">Sin evaluaciones todavía.</div>';
  }
  function grabar(){
    body.innerHTML=`<div class="grid" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px" id="esGrid">
      <div class="card pad-lg">
        <label class="lbl" for="esTema">Tema</label>
        <select class="inp" id="esTema">${TEMAS_ESPEJO.map(t=>`<option ${t===tema?'selected':''}>${esc(t)}</option>`).join('')}</select>
        <div class="cam mt12"><video id="esVid" playsinline muted class="mirror"></video><div class="empty" id="esEmpty"><div><div style="font-size:40px">🎥</div><p class="mt8">Activa la cámara para empezar</p></div></div><div class="ov" id="esOv"></div><div class="badge" id="esBadge" hidden><i></i><span id="esT">0:60</span></div></div>
        <div class="prog mt12"><i id="esProg"></i></div>
        <div class="row mt12"><button class="btn pri" id="esCam">Activar cámara</button><button class="btn" id="esRec" disabled>Grabar 60 s</button><button class="btn ghost" id="esStop" hidden>Detener</button></div>
        <div id="esAviso" class="mt12"></div>
      </div>
      <div>
        <div class="card pad-lg"><h3>Autoevaluación</h3><p class="muted small mt8">Mira tu video y califica cada punto.</p>
          <div class="chk mt12">${CHECK_ESPEJO.map((c,i)=>`<div class="ci"><span>${esc(c)}</span><span class="tri" data-i="${i}"><button data-v="0" class="${evals[i]===0?'on':''}">Mejorar</button><button data-v="1" class="${evals[i]===1?'on':''}">Regular</button><button data-v="2" class="${evals[i]===2?'on':''}">Bien</button></span></div>`).join('')}</div>
          <button class="btn vio block mt16" id="esSave" disabled>Guardar evaluación</button>
          <p class="tiny dim mt8" id="esHint">Graba tu video y califica los 6 puntos para guardar.</p>
        </div>
        <div class="card mt16"><h3>Historial</h3><div class="hist mt12" id="esHist">${hist()}</div></div>
      </div></div>`;
    const st=document.createElement('style'); st.textContent='@media (max-width:900px){#esGrid{grid-template-columns:1fr!important}}'; body.appendChild(st);
    const vid=$('#esVid',body);
    if(url){vid.src=url; vid.muted=false; vid.controls=true; vid.classList.remove('mirror'); $('#esEmpty',body).hidden=true; $('#esCam',body).textContent='Grabar de nuevo';}
    $('#esTema',body).onchange=e=>tema=e.target.value;
    const listo=()=>{const ok=grabado&&evals.every(v=>v!==null); $('#esSave',body).disabled=!ok; $('#esHint',body).hidden=ok;};
    listo();
    $$('.tri',body).forEach(t=>t.onclick=e=>{const b=e.target.closest('button'); if(!b) return; const i=+t.dataset.i; evals[i]=+b.dataset.v; $$('button',t).forEach(x=>x.classList.toggle('on',x===b)); listo();});
    $('#esCam',body).onclick=async()=>{
      if(!contextoSeguro||!tieneMedia){$('#esAviso',body).innerHTML=`<div class="note bad">${I.info}<span>Este navegador no permite usar la cámara. Abre la app en Google Chrome.</span></div>`;return;}
      try{
        if(stream) stream.getTracks().forEach(t=>t.stop());
        stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:true});
      }catch(e){
        $('#esAviso',body).innerHTML=`<div class="note bad">${I.info}<span>${e&&e.name==='NotAllowedError'?'Bloqueaste el permiso de cámara o micrófono. Toca el candado junto a la dirección, permítelos y recarga.':e&&e.name==='NotFoundError'?'No se encontró una cámara.':'No se pudo abrir la cámara. Cierra otras apps que la usen e intenta de nuevo.'}</span></div>`; return;
      }
      if(url){URL.revokeObjectURL(url); url=null;} grabado=false; listo();
      vid.controls=false; vid.removeAttribute('src'); vid.srcObject=stream; vid.muted=true; vid.classList.add('mirror');
      try{await vid.play()}catch(e){}
      $('#esEmpty',body).hidden=true; $('#esAviso',body).innerHTML='';
      $('#esRec',body).disabled=!window.MediaRecorder; $('#esCam',body).textContent='Reiniciar cámara';
      if(!window.MediaRecorder) $('#esAviso',body).innerHTML=`<div class="note warn">${I.info}<span>Tu navegador no puede grabar video. Puedes practicar frente a la cámara en vivo y evaluarte igual.</span></div>`, grabado=true, listo();
    };
    $('#esRec',body).onclick=()=>{
      $('#esRec',body).disabled=true; $('#esCam',body).disabled=true; let n=3; const ov=$('#esOv',body); ov.textContent=n;
      cd=setInterval(()=>{n--; if(n>0){ov.textContent=n;} else {clearInterval(cd); ov.textContent=''; iniciarRec();}},1000);
    };
    function iniciarRec(){
      chunks=[];
      const tipos=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'];
      const tipo=tipos.find(t=>{try{return MediaRecorder.isTypeSupported(t)}catch(e){return false}});
      try{ recorder=tipo?new MediaRecorder(stream,{mimeType:tipo}):new MediaRecorder(stream); }
      catch(e){ $('#esAviso',body).innerHTML=`<div class="note bad">${I.info}<span>No se pudo iniciar la grabación en este navegador.</span></div>`; $('#esCam',body).disabled=false; return; }
      recorder.ondataavailable=e=>{if(e.data&&e.data.size) chunks.push(e.data)};
      recorder.onstop=()=>{
        const blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'});
        if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;}
        if(url) URL.revokeObjectURL(url);
        url=URL.createObjectURL(blob);
        const v=$('#esVid',body); if(!v) return;
        v.srcObject=null; v.src=url; v.muted=false; v.controls=true; v.classList.remove('mirror');
        $('#esBadge',body).hidden=true; $('#esStop',body).hidden=true; $('#esCam',body).disabled=false; $('#esCam',body).textContent='Grabar de nuevo'; $('#esRec',body).disabled=true;
        grabado=true; listo(); toast('Video listo. Míralo y evalúate.','ok');
      };
      recorder.start(1000);
      const t0=Date.now(); $('#esBadge',body).hidden=false; $('#esStop',body).hidden=false;
      tmr=setInterval(()=>{const s=(Date.now()-t0)/1000; const r=Math.max(0,60-s); const tt=$('#esT',body); if(tt) tt.textContent='0:'+pad(Math.ceil(r)); const p=$('#esProg',body); if(p) p.style.width=Math.min(100,s/60*100)+'%'; if(s>=60) pararRec();},200);
    }
    function pararRec(){clearInterval(tmr); if(recorder&&recorder.state!=='inactive'){try{recorder.stop()}catch(e){}}}
    $('#esStop',body).onclick=pararRec;
    $('#esSave',body).onclick=()=>{
      const score=Math.round(evals.reduce((a,b)=>a+b,0)/(CHECK_ESPEJO.length*2)*100);
      S.espejo.push({f:new Date().toISOString(),tema,ev:evals.slice(),score}); if(S.espejo.length>300) S.espejo=S.espejo.slice(-300); guardar();
      const flojos=CHECK_ESPEJO.filter((c,i)=>evals[i]===0);
      $('#esHist',body).innerHTML=hist();
      modal(`<div class="row" style="gap:18px"><div class="score-ring" style="--v:${score};--c:${color(score)}"><div><div><b>${score}</b><span>de 100</span></div></div></div>
        <div class="grow"><h2>Evaluación guardada</h2><p class="muted mt8">${flojos.length?'Enfócate mañana en: <b style="color:var(--text)">'+flojos.map(esc).join(', ')+'</b>.':'¡Muy bien! Mantén estos hábitos en tus juntas reales.'}</p></div></div>
        <div class="row mt24"><button class="btn pri" data-close>Listo</button></div>`);
      evals=new Array(CHECK_ESPEJO.length).fill(null); $$('.tri button',body).forEach(b=>b.classList.remove('on')); listo();
    };
  }
  function fichas(){
    apagar();
    body.innerHTML=`<p class="muted">Toca cada tarjeta para ver qué puede significar la señal y cómo responder. Recuerda: busca grupos de señales, nunca una sola.</p>
    <div class="flips mt16">${FICHAS.map(f=>`<button class="flip"><div class="fi"><div class="fa"><span class="tiny muted">SEÑAL</span><b>${esc(f[0])}</b><span class="tiny dim">Toca para voltear</span></div><div class="fb"><span><b>Puede significar:</b> ${esc(f[1])}</span><span><b>Cómo responder:</b> ${esc(f[2])}</span></div></div></button>`).join('')}</div>`;
    $$('.flip',body).forEach(f=>f.onclick=()=>f.classList.toggle('on'));
  }
  function apagar(){
    clearInterval(tmr); clearInterval(cd);
    if(recorder&&recorder.state!=='inactive'){recorder.onstop=null; try{recorder.stop()}catch(e){}}
    if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;}
  }
  grabar();
  limpiar=()=>{apagar(); if(url){URL.revokeObjectURL(url); url=null;}};
}

/* ============ PROGRESO ============ */
function vProgreso(el){
  const v=S.voz.slice(-15), s=S.sim.slice(-15);
  const prom=(a,k)=>a.length?Math.round(a.reduce((x,y)=>x+(+y[k]||0),0)/a.length):null;
  const vConPal=S.voz.filter(x=>x.palabras>0);
  const mulMin=x=>x.dur?+(x.mul/(x.dur/60)).toFixed(1):0;
  // semanas (lunes)
  const sem=[]; const b=new Date(); b.setHours(0,0,0,0); b.setDate(b.getDate()-((b.getDay()+6)%7));
  for(let i=7;i>=0;i--){const d=new Date(b); d.setDate(b.getDate()-i*7); sem.push(d);}
  const enSem=(f,i)=>{const d=parseDia(diaDe(f)); const e=new Date(sem[i]); e.setDate(e.getDate()+7); return d>=sem[i]&&d<e;};
  const enSemDia=(k,i)=>{const d=parseDia(k); const e=new Date(sem[i]); e.setDate(e.getDate()+7); return d>=sem[i]&&d<e;};
  const actSem=sem.map((d,i)=>S.voz.filter(x=>enSem(x.f,i)).length+S.sim.filter(x=>enSem(x.f,i)).length+S.espejo.filter(x=>enSem(x.f,i)).length+Object.keys(S.retos).filter(k=>S.retos[k]&&S.retos[k].hecho&&enSemDia(k,i)).length);
  const lbSem=sem.map(d=>d.getDate()+'/'+(d.getMonth()+1));
  const primeras=vConPal.slice(0,3), ultimas=vConPal.slice(-3);
  const avgM=a=>a.reduce((x,y)=>x+mulMin(y),0)/a.length;
  const mejoraMul= vConPal.length>=6 ? +(avgM(primeras)-avgM(ultimas)).toFixed(1) : null;
  const total=S.voz.length+S.sim.length+S.espejo.length+Object.values(S.retos).filter(x=>x&&x.hecho).length;
  el.innerHTML=`
  <div class="head"><div><div class="kicker">Tu evolución</div><h1>Tablero de progreso</h1><p>Lo que se mide, mejora. Revisa aquí tu avance cada semana.</p></div></div>
  <div class="grid g4">
    <div class="stat"><div class="l">Racha actual</div><div class="v">🔥 ${racha()}</div></div>
    <div class="stat"><div class="l">Prácticas totales</div><div class="v">${total}</div></div>
    <div class="stat"><div class="l">Ritmo promedio</div><div class="v">${prom(vConPal.slice(-5),'ppm')??'–'}<span class="small muted"> ppm</span></div></div>
    <div class="stat"><div class="l">Simulador promedio</div><div class="v">${prom(S.sim.slice(-5),'total')??'–'}<span class="small muted"> /100</span></div></div>
  </div>
  ${total===0?`<div class="card mt24"><div class="empty-state"><div style="font-size:40px">📈</div><p class="mt8">Aún no hay prácticas. Empieza con el <a href="#voz" data-go="voz">Laboratorio de voz</a>: en 3 minutos tendrás tu primer dato.</p></div></div>`:''}
  <div class="grid g2 mt16">
    <div class="card"><div class="row between"><h3>Ritmo de voz</h3><span class="chip ok">Meta 130–160</span></div>
      <div class="mt12">${vConPal.length?lineChart([{v:vConPal.slice(-15).map(x=>x.ppm),c:'var(--cyan)'}],vConPal.slice(-15).map((x,i)=>String(i+1)),{band:[130,160],floor:0}):'<div class="empty-state">Graba en el Laboratorio de voz.</div>'}</div>
      <p class="tiny dim">Palabras por minuto en tus últimas sesiones.</p></div>
    <div class="card"><div class="row between"><h3>Muletillas por minuto</h3>${mejoraMul!=null?`<span class="chip ${mejoraMul>0?'ok':'warn'}">${mejoraMul>0?'↓ bajaron '+mejoraMul:'Sigue practicando'}</span>`:''}</div>
      <div class="mt12">${vConPal.length?lineChart([{v:vConPal.slice(-15).map(mulMin),c:'var(--bad)'}],vConPal.slice(-15).map((x,i)=>String(i+1)),{floor:0,min:0}):'<div class="empty-state">Graba en el Laboratorio de voz.</div>'}</div>
      <p class="tiny dim">Meta: menos de 1 por minuto.</p></div>
    <div class="card"><h3>Calificación de voz y espejo</h3>
      <div class="mt12">${v.length||S.espejo.length?lineChart([{v:v.map(x=>x.score),c:'var(--acc)'},{v:S.espejo.slice(-15).map(x=>x.score),c:'var(--vio)'}],Array.from({length:Math.max(v.length,Math.min(15,S.espejo.length))},(_,i)=>String(i+1)),{min:0,max:100,floor:0}):'<div class="empty-state">Sin datos todavía.</div>'}</div>
      <div class="legend"><span><i style="background:var(--acc)"></i>Voz</span><span><i style="background:var(--vio)"></i>Espejo</span></div></div>
    <div class="card"><h3>Simulador: claridad, empatía y firmeza</h3>
      <div class="mt12">${s.length?lineChart([{v:s.map(x=>x.claridad),c:'var(--cyan)'},{v:s.map(x=>x.empatia),c:'var(--vio)'},{v:s.map(x=>x.firmeza),c:'var(--acc)'}],s.map((x,i)=>String(i+1)),{min:0,max:10,floor:0}):'<div class="empty-state">Practica en el Simulador.</div>'}</div>
      <div class="legend"><span><i style="background:var(--cyan)"></i>Claridad</span><span><i style="background:var(--vio)"></i>Empatía</span><span><i style="background:var(--acc)"></i>Firmeza</span></div></div>
    <div class="card"><h3>Prácticas por semana</h3><div class="mt12">${barChart(actSem,lbSem,'var(--ok)')}</div><p class="tiny dim">Semanas que inician en lunes. Incluye voz, simulador, espejo y retos.</p></div>
    <div class="card"><h3>Escenarios practicados</h3><div class="hist mt12">${ESCENARIOS.map(e=>{const xs=S.sim.filter(x=>x.id===e.id); const mj=xs.length?Math.max(...xs.map(x=>x.total)):null; return `<div class="it"><span>${e.e} ${esc(e.t)}</span><span class="row" style="gap:6px"><span class="chip">${xs.length}×</span>${mj!=null?`<b style="color:${color(mj)}">${mj}</b>`:'<span class="dim small">–</span>'}</span></div>`}).join('')}</div><p class="tiny dim mt8">Muestra tu mejor calificación en cada uno.</p></div>
  </div>`;
}

      <div id="ajEstado" class="mt12"></div>
      <details class="mt12"><summary class="small" style="cursor:pointer;color:var(--cyan)">¿Cómo consigo mi API key?</summary>
        <ol class="tips mt8"><li>Entra a <a href="https://console.anthropic.com" target="_blank" rel="noopener">console.anthropic.com</a> y crea tu cuenta.</li><li>En <b>Billing</b>, agrega saldo (con 5 USD alcanzan cientos de prácticas).</li><li>En <b>API Keys</b>, toca <b>Create Key</b>, copia la clave y pégala aquí.</li><li>No la compartas: cada persona de tu equipo debe usar la suya.</li></ol></details>
    </div>
    <div class="card pad-lg">
      <h3>Respaldo de tu progreso</h3>
      <p class="muted small mt8">Tu progreso vive en este navegador. Descarga un respaldo y súbelo a tu Google Drive; para pasarlo a otro dispositivo, abre la app allá e impórtalo.</p>
      <div class="row mt12"><button class="btn pri" id="ajExp">Descargar respaldo</button><label class="btn" for="ajImpF" style="cursor:pointer">Importar respaldo</label><input type="file" id="ajImpF" accept="application/json,.json" hidden></div>
      <div id="ajImpEst" class="mt12"></div>
    </div>
    <div class="card pad-lg">
      <h3>Borrar datos</h3>
      <p class="muted small mt8">Elimina todo tu progreso de este navegador. Descarga un respaldo antes si lo quieres conservar.</p>
      <button class="btn danger mt12" id="ajReset">Borrar todo mi progreso</button>
      ${storageOk?'':`<div class="note warn mt12">${I.info}<span>Este navegador no está guardando datos (quizá estás en modo incógnito). Tu progreso se perderá al cerrar.</span></div>`}
    </div>
  </div>`;
  const nom=$('#ajNom',el); nom.onchange=()=>{S.nombre=nom.value.trim().slice(0,40); guardar(); toast('Nombre guardado','ok');};
  $('#ajLeer',el).onchange=e=>{S.leer=e.target.checked; guardar(); if(!S.leer) callar();};
  $('#ajPlan',el).onclick=()=>{S.inicio=hoy(); guardar(); toast('Plan reiniciado: semana 1','ok'); render();};
  $('#ajVer',el).onclick=()=>{const i=$('#ajKey',el); i.type=i.type==='password'?'text':'password'; $('#ajVer',el).textContent=i.type==='password'?'Ver':'Ocultar';};
  $('#ajMod',el).onchange=e=>{S.modelo=e.target.value; guardar();};
  const est=$('#ajEstado',el);
  $('#ajGuardar',el).onclick=()=>{
    const v=$('#ajKey',el).value.trim();
    if(v&&!/^sk-ant-/.test(v)){est.innerHTML=`<div class="note warn">${I.info}<span>La key de Anthropic empieza con «sk-ant-». Revisa que la copiaste completa.</span></div>`;return;}
    if(v) lsSet(KEY_API,v); else lsDel(KEY_API);
    S.modelo=$('#ajMod',el).value; guardar(); toast(v?'API key guardada':'API key eliminada','ok'); vAjustes(el);
  };
  $('#ajProbar',el).onclick=async()=>{
    const v=$('#ajKey',el).value.trim(); if(!v){est.innerHTML=`<div class="note warn">${I.info}<span>Primero pega tu API key.</span></div>`;return;}
    if(v!==apiKey()) lsSet(KEY_API,v);
    S.modelo=$('#ajMod',el).value; guardar();
    est.innerHTML=`<div class="note">${I.info}<span>Probando…</span></div>`;
    try{await llamarIA('Responde solo: OK',[{role:'user',content:'Prueba'}],10); est.innerHTML=`<div class="note ok">${I.check}<span>Conexión correcta. El modo IA del simulador ya está activo.</span></div>`;}
    catch(e){est.innerHTML=`<div class="note bad">${I.info}<span>${esc(msgError(e))}</span></div>`;}
  };
  const bk=$('#ajBorrarKey',el); if(bk) bk.onclick=()=>{lsDel(KEY_API); toast('API key eliminada','ok'); vAjustes(el);};
  $('#ajExp',el).onclick=()=>{
    try{
      const blob=new Blob([JSON.stringify({app:'gimnasio-carisma',version:1,exportado:new Date().toISOString(),datos:S},null,2)],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='gimnasio-carisma-respaldo-'+hoy()+'.json';
      document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
      toast('Respaldo descargado. Súbelo a tu Google Drive.','ok');
    }catch(e){toast('No se pudo descargar el respaldo','bad');}
  };
  $('#ajImpF',el).onchange=e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const o=JSON.parse(r.result); const d=o&&o.app==='gimnasio-carisma'&&o.datos?o.datos:null;
        if(!d||typeof d!=='object') throw 0;
        const m=modal(`<h2>¿Importar respaldo?</h2><p class="muted mt8">Contiene ${(d.voz||[]).length} sesiones de voz, ${(d.sim||[]).length} del simulador, ${(d.espejo||[]).length} de espejo y ${Object.values(d.retos||{}).filter(x=>x&&x.hecho).length} retos cumplidos.</p>
          <div class="row mt24"><button class="btn pri" data-r="rep">Reemplazar mi progreso</button><button class="btn" data-r="mez">Combinar con mi progreso</button><button class="btn ghost" data-close>Cancelar</button></div>`);
        $$('[data-r]',m).forEach(b=>b.onclick=()=>{
          if(b.dataset.r==='rep') S=sanear(Object.assign(defaults(),d));
          else{
            const dd=sanear(Object.assign(defaults(),d));
            ['voz','sim','espejo'].forEach(k=>{const vistos=new Set(S[k].map(x=>x.f)); dd[k].forEach(x=>{if(x&&x.f&&!vistos.has(x.f))S[k].push(x)}); S[k].sort((a,b)=>a.f<b.f?-1:1);});
            Object.keys(dd.retos).forEach(k=>{const a=S.retos[k],x=dd.retos[k]; if(!a||(x&&x.hecho&&!a.hecho)) S.retos[k]=x;});
            Object.keys(dd.lecciones).forEach(k=>{if(dd.lecciones[k]) S.lecciones[k]=true;});
            if(dd.inicio<S.inicio) S.inicio=dd.inicio; if(!S.nombre) S.nombre=dd.nombre;
          }
          guardar(); cerrarModal(); toast('Respaldo importado','ok'); render();
        });
      }catch(err){$('#ajImpEst',el).innerHTML=`<div class="note bad">${I.info}<span>El archivo no es un respaldo válido de Gimnasio de Carisma.</span></div>`;}
      e.target.value='';
    };
    r.onerror=()=>{$('#ajImpEst',el).innerHTML=`<div class="note bad">${I.info}<span>No se pudo leer el archivo.</span></div>`;};
    r.readAsText(f);
  };
  $('#ajReset',el).onclick=()=>{
    const m=modal(`<h2>¿Borrar todo tu progreso?</h2><p class="muted mt8">Se eliminarán tus sesiones, retos, evaluaciones y lecciones dominadas de este navegador. Tu API key se conserva. No se puede deshacer.</p>
      <div class="row mt24"><button class="btn danger" id="okReset">Sí, borrar todo</button><button class="btn" data-close>Cancelar</button></div>`);
    $('#okReset',m).onclick=()=>{S=defaults(); guardar(); cerrarModal(); toast('Progreso borrado','ok'); ir('inicio');};
  };
}

/* ============ ARRANQUE ============ */
if(!lsGet(KEY)) guardar();
if('speechSynthesis' in window){try{speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}catch(e){}}
window.addEventListener('pagehide',()=>{ if(limpiar){try{limpiar()}catch(e){}} });
render();
})();
</script>
</body>
</html>
